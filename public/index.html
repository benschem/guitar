<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Guitar</title>
    <style>
      :root {
        color-scheme: light dark;

        /* Surfaces */
        --background: #f4f4f6;
        --surface: #ffffff;
        --surface-2: #e9e9ee;
        --border: #dcdce2;
        --border-strong: #c2c2cb;

        /* Text */
        --foreground: #0a0a0c;
        --muted: #5f5f6a;
        --dim: #a0a0aa;

        /* Brand / CTA, and the text that sits on it */
        --accent: #0a0a0c;
        --accent-foreground: #fafafa;
        --danger: #d0103a;

        /* Type */
        --font-sans-serif:
          'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
          'Helvetica Neue', Arial, sans-serif;

        /* Spacing scale */
        --space-1: 6px;
        --space-2: 12px;
        --space-3: 20px;
        --space-4: 28px;

        /* Radii: chip (badges) / medium (rows, buttons, surfaces) / pill (round affordances) */
        --radius-chip: 4px;
        --radius-medium: 14px;
        --radius-pill: 999px;
        --tap-minimum: 64px;
        --tick-mark-size: 28px;

        /* Layout */
        --app-max-width: 640px;
        --app-padding-horizontal: var(--space-3);
        --app-padding-top: var(--space-4);
        --app-padding-bottom: var(--space-4);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0c;
          --surface: #14141a;
          --surface-2: #1d1d25;
          --border: #2a2a33;
          --border-strong: #3a3a45;

          --foreground: #fafafa;
          --muted: #8c8c97;
          --dim: #56565f;

          --accent: #fafafa;
          --accent-foreground: #0a0a0c;
          --danger: #ff4060;
        }
      }

      @media (max-width: 380px) {
        :root {
          --app-padding-horizontal: var(--space-2);
          --app-padding-top: var(--space-3);
          --app-padding-bottom: var(--space-3);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans-serif);
        font-weight: 500;
        font-size: 17px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        min-height: 100svh;
        min-height: 100dvh;
        text-rendering: optimizeLegibility;
      }

      button {
        font-family: inherit;
        font-weight: 600;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      ul,
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
      }

      /* ---- App shell ---- */

      .app {
        min-height: 100svh;
        min-height: 100dvh;
        padding: var(--app-padding-top) var(--app-padding-horizontal) var(--app-padding-bottom);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        max-width: var(--app-max-width);
        margin: 0 auto;
        width: 100%;
      }

      /* ---- Type scale + utilities ---- */

      .h1 {
        font-size: clamp(2rem, 7.5vw, 2.75rem);
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }

      .h2 {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .h3 {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .muted {
        color: var(--muted);
      }

      /* Label hierarchy: three tiers, used consistently across screens.
         - .label-section : section divider, with a trailing hairline that means
                            "a new section starts here". Use on <h2>/<h3>.
         - .label         : small all-caps caption above a value.
         - .meta-line     : body-case meta text, not uppercase. */

      .label-section {
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
        margin: 0;
        padding-left: 2px;
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .label-section::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .label {
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .meta-line {
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.4;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      /* Read by screen readers, hidden on screen. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* ---- Buttons ---- */

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        min-height: var(--tap-minimum);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-medium);
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: var(--surface);
        color: var(--foreground);
        border: 1px solid var(--border);
        width: 100%;
        transition:
          background 120ms ease,
          transform 80ms ease,
          border-color 120ms ease,
          filter 120ms ease;
        text-align: center;
      }
      .button:active {
        transform: scale(0.985);
      }
      .button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .button--primary {
        background: var(--accent);
        color: var(--accent-foreground);
        border-color: var(--accent);
        font-weight: 900;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      .button--primary:active {
        filter: brightness(0.92);
      }

      /* Hover styles only where the main pointer can hover, so a tap on a
         touchscreen doesn't leave them stuck on. */
      @media (hover: hover) {
        .button:hover {
          background: var(--surface-2);
          border-color: var(--border-strong);
        }
        .button--primary:hover {
          background: color-mix(in srgb, var(--accent) 85%, var(--background));
          border-color: color-mix(in srgb, var(--accent) 85%, var(--background));
        }
      }

      .button:disabled,
      .button[aria-disabled='true'] {
        opacity: 0.35;
        pointer-events: none;
      }

      /* Quiet text link, with a 44px tap height. */

      .linkish {
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        min-height: 44px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .linkish:active {
        color: var(--foreground);
      }
      @media (hover: hover) {
        .linkish:hover {
          color: var(--foreground);
        }
      }

      /* ---- Breadcrumbs ---- */

      .breadcrumbs ol,
      .breadcrumbs li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1);
      }

      .breadcrumb-separator {
        color: var(--dim);
      }

      /* ---- Home ---- */

      .routine-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
      }

      .stream-card {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: var(--tap-minimum);
        padding: var(--space-2) var(--space-3);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        transition:
          background 120ms ease,
          transform 80ms ease,
          border-color 120ms ease;
      }
      .stream-card:active {
        transform: scale(0.985);
      }
      .stream-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        .stream-card:hover {
          background: var(--surface-2);
          border-color: var(--border-strong);
        }
      }

      .stream-card-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-2);
      }

      .stream-card-progress {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* ---- Text blocks ---- */
      /* Intro, after, How to use and Toolkit text, from CONTENT's blocks. */

      .prose {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        line-height: 1.5;
      }

      .prose ul {
        list-style: disc;
        padding-left: 1.25em;
      }

      .prose ol {
        list-style: decimal;
        padding-left: 1.5em;
      }

      .prose li + li {
        margin-top: var(--space-1);
      }

      /* Wide tables scroll inside this box instead of widening the page. */
      .table-scroll {
        overflow-x: auto;
      }

      .prose table {
        border-collapse: collapse;
        min-width: 100%;
        font-size: 0.9rem;
      }

      .prose th,
      .prose td {
        text-align: left;
        vertical-align: top;
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
      }

      .prose th {
        color: var(--muted);
        font-weight: 700;
      }

      /* A [[slug]] in the text: the level's title, linked. */
      .mention {
        font-weight: 600;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      /* ---- Stream ---- */

      .level-row {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-1);
        min-height: var(--tap-minimum);
        padding: var(--space-2) var(--space-3);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-medium);
        transition:
          background 120ms ease,
          transform 80ms ease;
      }
      .level-row--current {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .level-row:has(.level-row-link:active) {
        transform: scale(0.985);
      }
      @media (hover: hover) {
        .level-row:has(.level-row-link:hover) {
          background: var(--surface-2);
        }
      }

      /* The whole row opens the level: the link's ::after stretches over
         the row, and Needs tags sit above it so they stay tappable on their
         own. A row can't simply be one big link, because links can't nest. */
      .level-row-link {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .level-row-link::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: var(--radius-medium);
      }
      .level-row-link:focus-visible {
        outline: none;
      }
      .level-row-link:focus-visible::after {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .level-row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .level-row-title {
        font-weight: 600;
      }
      .level-row--ticked .level-row-title {
        color: var(--muted);
      }

      /* Sized in em, so a larger font-size scales the whole mark. */
      .tick-mark {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: var(--tick-mark-size);
        width: 1em;
        height: 1em;
        border: 0.08em solid var(--border-strong);
        border-radius: var(--radius-pill);
      }
      .tick-mark--ticked {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-foreground);
      }
      /* The check is the right and bottom borders of a box, turned 45°. */
      .tick-mark--ticked::after {
        content: '';
        width: 0.25em;
        height: 0.45em;
        border: solid currentColor;
        border-width: 0 0.08em 0.08em 0;
        transform: translateY(-0.04em) rotate(45deg);
      }

      .needs-tags {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        /* Lines the tags up with the title, past the tick mark. */
        padding-left: calc(var(--tick-mark-size) + var(--space-2));
      }

      .needs-tag {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 4px var(--space-2);
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.3;
        color: var(--muted);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-chip);
      }
      /* Grows the tap area to 44px without making the tag look bigger. */
      .needs-tag::before {
        content: '';
        position: absolute;
        inset: -6px 0;
      }
      a.needs-tag:active {
        color: var(--foreground);
      }
      @media (hover: hover) {
        a.needs-tag:hover {
          color: var(--foreground);
        }
      }
    </style>

  <body>
    <main id="app" class="app"></main>
    <script>
      'use strict';

      // ---- Content ----
      // Every word on the site lives here, so wording can change without
      // touching the layout code below.
      //
      // - Text is in backticks, so ' and " can be typed as they are.
      // - A level's slug is its permanent ID. Ticks and links use it, so
      //   never rename one. Title and order can change freely.
      // - To refer to a level in any text, write [[slug]]. It shows as the
      //   level's current title, linked, so it can't go stale.
      // - intro, after, howToUse and toolkit hold blocks:
      //   { type: 'p', text }, { type: 'heading', text },
      //   { type: 'list', ordered, items: [{ label, text }] } where label is
      //   an optional bold lead-in, and { type: 'table', head, rows }.

      const CONTENT = {
        howToUse: [
          {
            type: 'p',
            text: `Pick a stream by mood, do its lowest unticked level as a Quick (15 min) or Long (30–45 min) session, and tick the level when you pass its "Done when" test.`,
          },
          {
            type: 'list',
            ordered: false,
            items: [
              {
                label: `Don't know what you feel like?`,
                text: `Do an Everything routine (next section).`,
              },
              {
                label: `Know what you feel like?`,
                text: `Pick a stream, go to your lowest unticked level, choose Quick or Long.`,
              },
              {
                label: `Repeat a level`,
                text: `as many sessions as it takes. Move on when you pass the test, not when you're bored. If you're bored, switch stream.`,
              },
              { label: `"Needs"`, text: `on a level means do that other level first.` },
              {
                label: `Write your numbers`,
                text: `(BPM, changes per minute) next to a level's Done line so you can see progress.`,
              },
            ],
          },
          { type: 'heading', text: `The three rules` },
          {
            type: 'list',
            ordered: true,
            items: [
              {
                label: `Every session ends with at least 3 minutes of making music:`,
                text: `a progression to a drum beat, a jam over a backing track, or a loop. Drills don't count.`,
              },
              {
                label: `Videos only with the guitar on your lap.`,
                text: `Watch one only to learn the thing you're about to play, 10 minutes max, then play it.`,
              },
              {
                label: `Metronome or backing track on for almost everything.`,
                text: `Steady timing is most of what makes playing sound "normal".`,
              },
            ],
          },
          {
            type: 'p',
            text: `Play often rather than long. Four short sessions a week beats one big one, mostly because it builds the habit and keeps your hands used to the guitar. Quick sessions are built so you can pick up the guitar any night and start straight away.`,
          },
        ],

        routinesIntro: `Use these when you're not in the mood for anything in particular. Each slot uses your current level in that stream.`,

        // streamId is the stream whose current level the step links to, or
        // null for a step with no link.
        routines: [
          {
            id: 'quick',
            title: `Quick 15`,
            steps: [
              {
                minutes: 3,
                label: `Clean Hands`,
                streamId: 'clean-hands',
                text: `one-minute changes on your worst chord pair. Write down the count.`,
              },
              {
                minutes: 3,
                label: `Fretboard`,
                streamId: 'fretboard-map',
                text: `a random note, found on the E and A strings (later, on all six).`,
              },
              {
                minutes: 4,
                label: `Rhythm`,
                streamId: 'rhythm',
                text: `a 4-chord progression over a drum beat, no stopping. Use a different key each session.`,
              },
              {
                minutes: 5,
                label: `Jam`,
                streamId: 'lead-and-improv',
                text: `minor pentatonic over a backing track. Play short phrases and leave gaps between them.`,
              },
            ],
          },
          {
            id: 'long',
            title: `Long 45`,
            steps: [
              {
                minutes: 5,
                label: `warm-up`,
                streamId: null,
                text: `1-2-3-4 finger crawl up and down the neck at 60 BPM, then slides and bends.`,
              },
              {
                minutes: 8,
                label: `Clean Hands`,
                streamId: 'clean-hands',
                text: `one-minute changes on two pairs, then 3 minutes of a progression with your trickiest chord in it.`,
              },
              {
                minutes: 8,
                label: `Rhythm`,
                streamId: 'rhythm',
                text: `your current Rhythm level drill.`,
              },
              {
                minutes: 7,
                label: `Fretboard`,
                streamId: 'fretboard-map',
                text: `your current Fretboard level drill.`,
              },
              {
                minutes: 7,
                label: `Harmony`,
                streamId: 'harmony',
                text: `play a progression by number (like I–V–vi–IV) in a key you haven't used this week, naming the chords out loud.`,
              },
              {
                minutes: 10,
                label: `Jam`,
                streamId: 'lead-and-improv',
                text: `a loop or backing track, using your current Lead level.`,
              },
            ],
          },
        ],

        streams: [
          {
            id: 'clean-hands',
            name: `Clean Hands`,
            intro: [
              {
                type: 'p',
                text: `This stream is about getting rid of the gaps between chords, the dead strings and the unwanted ringing. These are what make playing sound like practice instead of music.`,
              },
            ],
            levels: [
              {
                slug: 'open-chords',
                title: `Open chord changes`,
                needs: [],
                intro: [],
                quick: `one-minute changes. Pick your two worst open-chord pairs (try C–G, G–D, Em–C, Am–E). Set a 1-minute timer and switch back and forth, strumming once per chord. Count the changes. Do 2 rounds per pair.`,
                long: `one-minute changes on 5 pairs. Then play G–D–Em–C at 70 BPM: first 4 beats per chord, then 2. Finish with 3 minutes of that progression over a drum beat.`,
                after: [
                  {
                    type: 'p',
                    text: `Tips: keep any finger that stays on the same fret (a "pivot finger") down between chords. Look at where you're going next before you move. Letting open strings ring on the last strum before a change is normal in rock, and it keeps you in time.`,
                  },
                ],
                doneWhen: `60 changes a minute (30 of each chord) on every common open pair, with most of them ringing clean, and G–D–Em–C at 2 beats per chord at 80 BPM with no gaps.`,
              },
              {
                slug: 'barre-chords',
                title: `Barre chords that ring and change`,
                needs: [],
                intro: [],
                quick: `the string check. Play an E-shape barre at fret 5 (A), then pick each string on its own. Fix any dead string by rolling your index finger slightly onto its bony edge, dropping your thumb behind the neck and pulling your elbow in. Repeat for A-shape, minor E-shape and minor A-shape.`,
                long: `string check, then one-minute changes between shapes. Try A (E-shape, fret 5) to D (A-shape, fret 5), and Am (fret 5) to Dm (fret 5). Then play A–D–E entirely in barre chords over a drum beat.`,
                after: [],
                doneWhen: `every string rings on all four shapes at three different frets, and 30+ changes a minute between E-shape and A-shape.`,
              },
              {
                slug: 'muting',
                title: `Muting (both hands)`,
                needs: [],
                intro: [
                  {
                    type: 'p',
                    text: `On electric with any gain, unmuted strings get loud. Good players stop strings as much as they fret them.`,
                  },
                ],
                quick: `"chord, chk". Strum a chord, then relax your fretting hand so the strings are muted but not pressed. Strum again for a percussive "chk". Alternate them in 8ths at 80 BPM. Then power chords with gain on: strum all six strings and only 2–3 should sound. The tip of the finger on the root mutes the string below it. The underside of your index finger mutes the strings above.`,
                long: `the Quick drills, then palm muting. Rest the edge of your picking hand on the strings right by the bridge and play muted 8ths on the low E. Move closer to and further from the bridge until it chugs but still has pitch. Then switch every 2 bars between palm-muted and open on an E5–G5–A5 progression.`,
                after: [],
                doneWhen: `with gain up, you can strum all six strings on any power chord and hear only the chord, and "chord, chk" is even at 90 BPM.`,
              },
              {
                slug: 'sus-and-triads',
                title: `Sus chords and top-string triads`,
                needs: [],
                intro: [
                  {
                    type: 'p',
                    text: `This is a lot of the "indie" sound: open chords with notes added or moved, and small 3-string chords up the neck.`,
                  },
                ],
                quick: `the anchored set. G (320033), Cadd9 (x32033), Em7 (022033), Dsus4 (xx0233). Your ring and pinky stay on the top two strings the whole time. Change between them slowly, then over a drum beat.`,
                long: `sus moves inside a strum. Play D, Dsus2, D, Dsus4 and A, Asus2, A, Asus4 without breaking rhythm. Then learn G, C and D as triads on the top 3 strings in two places each, and play a progression with only those.`,
                after: [],
                doneWhen: `you can add sus moves to any 4-chord progression without breaking rhythm, and play it with top-string triads.`,
              },
            ],
          },
          {
            id: 'rhythm',
            name: `Rhythm`,
            intro: [
              {
                type: 'p',
                text: `Rhythm is most of jamming. A simple part played in time sounds better than a clever part that wobbles.`,
              },
            ],
            levels: [
              {
                slug: 'lock-to-click',
                title: `Lock to the click`,
                needs: [],
                intro: [],
                quick: `metronome at 70 BPM. Downstrums on each beat on one chord, counting "1 2 3 4" out loud. Then 8ths: down on the numbers, up on the "and". Your hand never stops moving down-up, even when it doesn't hit the strings.`,
                long: `the Quick drill with chord changes. Then halve the metronome speed (70 to 35 BPM) and treat each click as beat 2 or 4, where the snare goes. Keep strumming 8ths. Record 1 minute on your phone and listen back for rushing or dragging.`,
                after: [],
                doneWhen: `8ths with constant hand motion at 100 BPM for 2 minutes including changes, and the recording sounds even.`,
              },
              {
                slug: 'strumming',
                title: `Strumming patterns`,
                needs: [],
                intro: [
                  {
                    type: 'p',
                    text: `Every strumming pattern is the same constant down-up motion, with some strokes missing the strings. Once that clicks, you can make up patterns instead of memorising them.`,
                  },
                ],
                quick: `D · D U · U D U (the strings are hit on 1, 2, 2-and, 3-and, 4, 4-and; the dots are misses). Use constant motion on one chord, then over G–D–Em–C.`,
                long: `the Quick pattern, then 16ths ("1 e and a") at 60 BPM with accents on 2 and 4. Make up three patterns of your own. Put on a song you like and work out whether it's an 8th or 16th feel.`,
                after: [],
                doneWhen: `you can switch between three patterns mid-progression without stopping or losing the beat.`,
              },
              {
                slug: 'power-chords',
                title: `Power chords and palm muting`,
                needs: ['muting'],
                intro: [],
                quick: `palm-muted 8ths on E5, then A5, then D5, at 100 BPM. Accent the first of every 4.`,
                long: `classic rock moves. Try the A5–A6 shuffle, alternating palm-muted and open bars, and a "push" where the next chord lands on the "and" of 4 instead of on 1. Then write your own 4-bar riff using all three.`,
                after: [],
                doneWhen: `your own 4-bar power-chord riff at 120 BPM, with palm mutes and one push, played 4 times in a row cleanly.`,
              },
              {
                slug: 'looper',
                title: `The looper`,
                needs: [],
                intro: [
                  {
                    type: 'p',
                    text: `The whole trick is pressing the pedal exactly on beat 1 to start and exactly on the next beat 1 to stop.`,
                  },
                ],
                quick: `metronome at 80. Count "1 2 3 4" out loud, press record on the next 1, strum one chord on the downbeats for 4 bars, and press again on the following 1. Play anything over it for 2 minutes, then delete it. Do this 3 times.`,

      const APP_TITLE = 'Guitar';

      // ---- DOM helper ----

      // Builds an element from plain properties and children. Strings become
      // text nodes, so content is never parsed as HTML.
      function element(tagName, properties = {}, children = []) {
        const node = document.createElement(tagName);
        Object.assign(node, properties);
        node.append(...children);
        return node;
      }

      // ---- Levels ----

      // Every level by slug, for mentions and Needs tags.
      const LEVELS_BY_SLUG = new Map(
        CONTENT.streams.flatMap((stream) => stream.levels.map((level) => [level.slug, level])),
      );

      function streamOfLevel(slug) {
        return CONTENT.streams.find((stream) => stream.levels.some((level) => level.slug === slug));
      }

      // The lowest unticked level, or -1 when every level is ticked. Needs
      // are shown as tags but don't lock a level, so they don't count here.
      function currentLevelIndex(stream, tickedSlugs) {
        return stream.levels.findIndex((level) => !tickedSlugs.has(level.slug));
      }

      // ---- Ticks cache ----
      // The last ticks response from the server, kept in localStorage so
      // screens can draw ticks straight away. The stored value may be
      // missing, hand-edited or unreadable, so the read checks its shape and
      // falls back to nothing ticked.

      const TICKS_CACHE_KEY = 'guitar:ticks';

      function readCachedTicks() {
        try {
          const cached = JSON.parse(localStorage.getItem(TICKS_CACHE_KEY));
          if (Array.isArray(cached?.ticks)) {
            return new Set(cached.ticks.filter((slug) => typeof slug === 'string'));
          }
        } catch {
          // Storage is blocked (some private modes) or the value isn't JSON.
        }
        return new Set();
      }

      // ---- Text and blocks ----

      const MENTION_PATTERN = /\[\[([^\]]+)\]\]/;

      // Turns a text field into nodes, with each [[slug]] replaced by a link
      // to that level. Splitting on a pattern with a capture group keeps
      // the captured slugs, at the odd positions of the result.
      function renderText(text) {
        return text
          .split(MENTION_PATTERN)
          .map((part, index) => (index % 2 === 1 ? renderMention(part) : part));
      }

      // An unknown slug stays as typed, so a typo shows on the page.
      function renderMention(slug) {
        const level = LEVELS_BY_SLUG.get(slug);
        if (!level) return `[[${slug}]]`;
        return element('a', {
          className: 'mention',
          href: `#/level/${slug}`,
          textContent: level.title,
        });
      }

      function renderBlocks(blocks) {
        return blocks.map((block) => {
          switch (block.type) {
            case 'p':
              return element('p', {}, renderText(block.text));
            case 'heading':
              return element('h2', { className: 'label-section' }, renderText(block.text));
            case 'list':
              return element(block.ordered ? 'ol' : 'ul', {}, block.items.map(renderListItem));
            case 'table':
              return renderTable(block);
            default:
              // Shown rather than thrown, so one typo doesn't blank the screen.
              return element('p', { textContent: `[Unknown block type: ${block.type}]` });
          }
        });
      }

      function renderListItem(item) {
        const children = renderText(item.text);
        if (item.label) children.unshift(element('strong', {}, renderText(item.label)), ' ');
        return element('li', {}, children);
      }

      function renderTable(block) {
        const headerCells = block.head.map((cell) =>
          element('th', { scope: 'col' }, renderText(cell)),
        );
        const bodyRows = block.rows.map((row) =>
          element(
            'tr',
            {},
            row.map((cell) => element('td', {}, renderText(cell))),
          ),
        );
        return element('div', { className: 'table-scroll' }, [
          element('table', {}, [
            element('thead', {}, [element('tr', {}, headerCells)]),
            element('tbody', {}, bodyRows),
          ]),
        ]);
      }

      // ---- Breadcrumbs ----
      // Every screen but Home starts with links to the screens above it.
      // The current screen is left out, since its heading names it.

      const HOME_CRUMB = { label: 'Home', href: '#/' };

      function breadcrumbs(crumbs) {
        const items = crumbs.map((crumb, index) => {
          const children = [
            element('a', { className: 'linkish', href: crumb.href, textContent: crumb.label }),
          ];
          if (index > 0) {
            children.unshift(
              element('span', { className: 'breadcrumb-separator', ariaHidden: 'true', textContent: '›' }),
            );
          }
          return element('li', {}, children);
        });
        return element('nav', { className: 'breadcrumbs', ariaLabel: 'Breadcrumb' }, [
          element('ol', {}, items),
        ]);
      }

      // ---- Screens ----
      // Each returns { title, nodes }: the document title (null for Home) and
      // the nodes that fill <main>.

      function renderHome() {
        const tickedSlugs = readCachedTicks();
        return {
          title: null,
          nodes: [
            element('section', { className: 'stack' }, [
              element('h2', { className: 'label-section', textContent: 'Everything routines' }),
              element(
                'div',
                { className: 'routine-buttons' },
                CONTENT.routines.map((routine) =>
                  element('a', {
                    className: 'button button--primary',
                    href: `#/everything/${routine.id}`,
                    textContent: routine.title,
                  }),
                ),
              ),
            ]),
            element('section', { className: 'stack' }, [
              element('h2', { className: 'label-section', textContent: 'Streams' }),
              element(
                'ul',
                { className: 'stack' },
                CONTENT.streams.map((stream) =>
                  element('li', {}, [streamCard(stream, tickedSlugs)]),
                ),
              ),
            ]),
          ],
        };
      }

      function streamCard(stream, tickedSlugs) {
        const tickedCount = stream.levels.filter((level) => tickedSlugs.has(level.slug)).length;
        const currentIndex = currentLevelIndex(stream, tickedSlugs);
        const currentLevelText =
          currentIndex === -1 ? 'Complete' : stream.levels[currentIndex].title;

        return element('a', { className: 'stream-card', href: `#/stream/${stream.id}` }, [
          element('span', { className: 'stream-card-heading' }, [
            element('span', { className: 'h3', textContent: stream.name }),
            element('span', {
              className: 'meta-line stream-card-progress',
              textContent: `${tickedCount} / ${stream.levels.length}`,
            }),
          ]),
          element('span', { className: 'meta-line', textContent: currentLevelText }),
        ]);
      }

      function renderStream(streamId) {
        const stream = CONTENT.streams.find((candidate) => candidate.id === streamId);
        if (!stream) return renderNotFound();

        const tickedSlugs = readCachedTicks();
        const currentIndex = currentLevelIndex(stream, tickedSlugs);

        return {
          title: stream.name,
          nodes: [
            breadcrumbs([HOME_CRUMB]),
            element('h1', { className: 'h1', textContent: stream.name }),
            element('div', { className: 'prose' }, renderBlocks(stream.intro)),
            element('section', { className: 'stack' }, [
              element('h2', { className: 'label-section', textContent: 'Levels' }),
              element(
                'ol',
                { className: 'stack' },
                stream.levels.map((level, index) =>
                  levelRow(level, {
                    isTicked: tickedSlugs.has(level.slug),
                    isCurrent: index === currentIndex,
                  }),
                ),
              ),
            ]),
          ],
        };
      }

      function levelRow(level, { isTicked, isCurrent }) {
        const tickMark = element('span', { className: 'tick-mark', ariaHidden: 'true' });
        tickMark.classList.toggle('tick-mark--ticked', isTicked);

        const linkText = [];
        if (isCurrent) linkText.push(element('span', { className: 'label', textContent: 'Current' }));
        linkText.push(element('span', { className: 'level-row-title', textContent: level.title }));
        if (isTicked) linkText.push(element('span', { className: 'sr-only', textContent: ' (ticked)' }));

        const children = [
          element('a', { className: 'level-row-link', href: `#/level/${level.slug}` }, [
            tickMark,
            element('span', { className: 'level-row-text' }, linkText),
          ]),
        ];
        if (level.needs.length > 0) {
          children.push(element('div', { className: 'needs-tags' }, level.needs.map(needsTag)));
        }

        const row = element('li', { className: 'level-row' }, children);
        row.classList.toggle('level-row--ticked', isTicked);
        row.classList.toggle('level-row--current', isCurrent);
        return row;
      }

      // "Needs" plus the needed level's title, linked to it. Like a mention,
      // an unknown slug stays as typed.
      function needsTag(slug) {
        const level = LEVELS_BY_SLUG.get(slug);
        if (!level) return element('span', { className: 'needs-tag', textContent: `Needs [[${slug}]]` });
        return element('a', {
          className: 'needs-tag',
          href: `#/level/${slug}`,
          textContent: `Needs ${level.title}`,
        });
      }

      function renderLevel(slug) {
        const level = LEVELS_BY_SLUG.get(slug);
        if (!level) return renderNotFound();

        const stream = streamOfLevel(slug);
        return placeholderScreen(level.title, [
          HOME_CRUMB,
          { label: stream.name, href: `#/stream/${stream.id}` },
        ]);
      }

      function renderRoutine(routineId) {
        const routine = CONTENT.routines.find((candidate) => candidate.id === routineId);
        if (!routine) return renderNotFound();
        return placeholderScreen(routine.title);
      }

      function renderPage(title) {
        return placeholderScreen(title);
      }

      function renderUnlock() {
        return placeholderScreen('Unlock');
      }

      function renderNotFound() {
        return {
          title: 'Not found',
          nodes: [
            breadcrumbs([HOME_CRUMB]),
            element('h1', { className: 'h1', textContent: 'Not found' }),
            element('p', { className: 'muted', textContent: 'There’s no screen at this address.' }),
          ],
        };
      }

      function placeholderScreen(title, parentCrumbs = [HOME_CRUMB]) {
        return {
          title,
          nodes: [
            breadcrumbs(parentCrumbs),
            element('h1', { className: 'h1', textContent: title }),
            element('p', { className: 'meta-line', textContent: 'Placeholder' }),
          ],
        };
      }

      // ---- Router ----
      // The part of the URL after '#' picks the screen, so each screen is its
      // own history entry and the back button and swipe-back work. A
      // pattern's capture groups are passed to its render function.

      const ROUTES = [
        { pattern: /^\/$/, render: () => renderHome() },
        { pattern: /^\/stream\/([a-z0-9-]+)$/, render: (streamId) => renderStream(streamId) },
        { pattern: /^\/level\/([a-z0-9-]+)$/, render: (slug) => renderLevel(slug) },
        { pattern: /^\/everything\/([a-z0-9-]+)$/, render: (routineId) => renderRoutine(routineId) },
        { pattern: /^\/how-to-use$/, render: () => renderPage('How to use') },
        { pattern: /^\/toolkit$/, render: () => renderPage('Toolkit') },
        { pattern: /^\/unlock$/, render: () => renderUnlock() },
      ];

      function screenForPath(path) {
        for (const route of ROUTES) {
          const match = route.pattern.exec(path);
          if (match) return route.render(...match.slice(1));
        }
        return renderNotFound();
      }

      function showCurrentScreen() {
        // An empty hash (the bare URL) is Home.
        const path = location.hash.slice(1) || '/';
        const screen = screenForPath(path);
        document.title = screen.title ? `${screen.title} · ${APP_TITLE}` : APP_TITLE;
        document.getElementById('app').replaceChildren(...screen.nodes);
        window.scrollTo(0, 0);
      }

      window.addEventListener('hashchange', showCurrentScreen);
      showCurrentScreen();
    </script>
  </body>
</html>
